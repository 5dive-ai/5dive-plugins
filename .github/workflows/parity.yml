name: fork parity

# Asserts the telegram-{codex,grok,agy} forks stay in lockstep with each other and
# in their documented delta from the Claude `telegram` baseline (DIVE-8). Pure static
# parse — no servers booted, no plugin deps installed.

on:
  push:
    paths:
      # DIVE-2374: 'plugins/**', not a per-plugin allowlist. The old list named
      # telegram/codex/grok/agy, so a change touching ONLY telegram-pi or
      # telegram-opencode triggered no CI at all -- the same fence-by-naming that
      # kept those two plugins out of the tna harness for their whole lifetime.
      - 'plugins/**'
      - 'generator/**'
      - 'test/**'
      - 'tests/**'
      - '.github/workflows/parity.yml'
  pull_request:
    paths:
      # DIVE-2374: 'plugins/**', not a per-plugin allowlist. The old list named
      # telegram/codex/grok/agy, so a change touching ONLY telegram-pi or
      # telegram-opencode triggered no CI at all -- the same fence-by-naming that
      # kept those two plugins out of the tna harness for their whole lifetime.
      - 'plugins/**'
      - 'generator/**'
      - 'test/**'
      - 'tests/**'
      - '.github/workflows/parity.yml'

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      # DIVE-4747: full history, not the default depth 1. The mod version guard is
      # scoped to `git merge-base main HEAD`, and that is what lets it tell "this
      # branch changed the mod and did not bump it" (a real defect) apart from "main
      # published a mod release this branch never touched" (the steady state that made
      # the board permanently red). With a depth-1 checkout there is no common history
      # to compute, the guard degrades to comparing against main's TIP, and a branch
      # that bumped to a number main has since published reads as unchanged — which is
      # exactly the DIVE-4720 collision going silent. test/mod-telemetry.test.ts pins
      # this line so the degradation cannot be reintroduced by deleting it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      # DIVE-2374: the whole suite, not a named file. CI ran ONLY parity.test.ts,
      # so test/tna-harness.test.ts -- the harness that owns the tap line -- had
      # never executed here. A test file must not be able to be absent from CI by
      # omission; `bun test` enrolls every file in test/ automatically.
      # DIVE-6000: the channel-fallback tests drive a REAL tmux pane (the keystroke
      # contract cannot be faked honestly) and skip where tmux is absent, which on
      # a bare runner meant they never ran here.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - run: bun test
      # Generator drift gate (DIVE-9): every runtime config must still regenerate
      # its committed fork byte-exact. Catches a fork hand-edited without updating
      # its generator config (or the base) — the structural successor to the
      # hand-kept parity above.
      - run: bun generator/generate.ts --check
      # DIVE-3752: entry-point PARSE gate. Neither step above parses a plugin
      # entry point — `bun test` never imports one (CI has no plugin deps) and
      # the generator is a text transform. Iteration 1 of DIVE-3752 shipped a
      # `plugins/telegram/server.ts` with an import nested inside another
      # import's brace list and both steps were green. `--no-bundle` transpiles
      # without resolving a single specifier, so this needs no node_modules.
      # test/entrypoint-parse.test.ts asserts the same thing from `bun test`;
      # this step exists so the failure has a name in the checks list.
      # DIVE-4202: `browser` and `voice` moved here from the CLI repo, and
      # browser's harness came with them. It is plain bash (no bun deps) and it
      # grades the shipped script + the manifest + this repo's marketplace entry
      # — the arms that used to red in 5dive-ai/5dive when the plugin broke.
      # Without this step the harness would sit in the repo unrun, which is
      # silence, not a green.
      - name: devteam core files harness
        run: bash tests/devteam_core_unit.sh
      # DIVE-8050: plugins/browser IS 5dive-ai/5dive-browser's browser/, byte for
      # byte. A hand edit here matches no upstream commit and is red; behind main is
      # a named warning. Then 5dive-browser's OWN harnesses, from the matched commit,
      # grade this tree (they replaced nine hand-kept copies that had drifted: the
      # copies are why a sync was a merge, and why nobody synced for five weeks).
      - name: browser mirror is byte-for-byte 5dive-browser
        run: bash tests/browser_mirror.sh check
        env:
          BROWSER_UPSTREAM_DIR: ${{ runner.temp }}/5dive-browser
          BROWSER_MIRROR_BRANCH: ${{ github.head_ref }}
      - name: browser registry entry harness
        run: bash tests/browser_registry_unit.sh
      - name: browser harnesses (5dive-browser's own, on this tree)
        run: >-
          bash tests/browser_mirror.sh run
          browser_plugin_unit.sh browser_connect_request_unit.sh browser_reflex_propose_unit.sh
          browser_tmpdir_unit.sh browser_input_drive_unit.sh browser_routine_delta_unit.sh
          browser_probe_timeout_unit.sh browser_served_probe_unit.sh browser_launch_env_unit.sh
          browser_act_upload_unit.sh
        env:
          BROWSER_UPSTREAM_DIR: ${{ runner.temp }}/5dive-browser
          BROWSER_MIRROR_BRANCH: ${{ github.head_ref }}
      # DIVE-7658: `5dive agent teams connect|status|disconnect` against a stubbed
      # 5dive. Root: connect writes another user's 0600 file and refuses anyone else.
      - name: teams CLI harness
        run: sudo bash tests/teams_cli_unit.sh
      # DIVE-4397: the unprivileged-first 5dive reader, and the arms that assert
      # all five telegram forks still route through it. `bun test` does not reach
      # it — the module is driven with an injected exec function from bash, and
      # the fork arms read the shipped server.ts as text. A harness that sits in
      # the repo unrun is silence, not a green (same reason as the step above).
      - name: telegram 5dive-reader harness
        run: bash tests/telegram_cliexec_unit.sh
      # DIVE-4481: the human-messaging rules ship to a customer by two
      # independent paths — the per-box CLAUDE.md template in 5dive-api and this
      # plugin's MCP instructions block. The redundancy is the point (a seat can
      # be paired from a box whose template was customised), and it is exactly
      # what a later prompt-slimming pass deletes without breaking anything else
      # in this repo. This arm is what notices.
      - name: telegram channel instructions carry the human-messaging rules
        run: bash tests/telegram_instructions_unit.sh
      # DIVE-6934: the buzz verbs (`5dive buzz …`, `5dive agent buzz …`) and the
      # buzz binary download left the core CLI for plugins/buzz, and their
      # harnesses came with them, re-pointed at plugins/buzz/cli. Plain bash, no
      # root, no network (file:// releases, stubbed relay).
      - name: buzz verb harnesses
        run: |
          rc=0
          for t in buzz_bridge_unit buzz_identity_registry_unit buzz_last_mile_unit \
                   buzz_pair_unit buzz_preseed_dm_unit buzz_server_pairing_unit buzz_binaries_unit \
                   buzz_onboarding_unit buzz_root_reexec_unit; do
            echo "=== $t"; bash "tests/$t.sh" || rc=1
          done
          exit $rc
      - name: entry points parse
        run: |
          rc=0
          for f in $(find plugins -name '*.ts' -not -path '*/node_modules/*' | sort); do
            bun build --no-bundle "$f" --outfile=/dev/null >/dev/null || { echo "PARSE FAILED: $f"; rc=1; }
          done
          exit $rc
      # DIVE-5336: the owner's authenticator seed. LAST: its live arm needs the
      # pinned playwright-core, installed in the copied tree (`run --npm`), and the
      # browser suites above grade the executor's "playwright is absent" refusals.
      - name: browser totp harness (5dive-browser's own, on this tree)
        run: bash tests/browser_mirror.sh run --npm browser_totp_unit.sh
        env:
          BROWSER_UPSTREAM_DIR: ${{ runner.temp }}/5dive-browser
          BROWSER_MIRROR_BRANCH: ${{ github.head_ref }}
